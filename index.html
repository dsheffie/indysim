<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>indysim — SGI Indy in your browser</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #0b0f14; color: #cfe3f7;
               font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { padding: 10px 16px; border-bottom: 1px solid #1d2a38; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .3px; }
  header p  { margin: 4px 0 0; font-size: 12px; color: #6f8aa6; }
  #controls { padding: 10px 16px; border-bottom: 1px solid #1d2a38; display: flex;
              gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12px; }
  button { background: #16222f; color: #cfe3f7; border: 1px solid #2a3f54; border-radius: 6px;
           padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: #1d2d3e; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-left: auto; color: #8fb0d0; }
  #status b { color: #cfe3f7; }
  #stage { display: flex; flex-wrap: wrap; gap: 0; }
  #screen { flex: 1 1 520px; display: none; background: #000; padding: 12px 16px; }
  #screen canvas { width: 100%; max-width: 1280px; height: auto; image-rendering: pixelated;
                   border: 1px solid #1d2a38; display: block; }
  #term { flex: 1 1 420px; box-sizing: border-box; height: 70vh; margin: 0; padding: 12px 16px;
          overflow-y: auto; white-space: pre-wrap; word-break: break-word;
          font-size: 12.5px; line-height: 1.35; color: #d7e6f5; }
  .diag { color: #6f8aa6; }
  .hint { color: #6f8aa6; }
</style>
</head>
<body>
  <header>
    <h1>indysim</h1>
    <p>SGI Indy (IP22) · MIPS R4400 · WebAssembly · <span id="build"></span></p>
  </header>

  <div id="controls">
    <button id="bootLinux">Boot IP22 Linux</button>
    <span class="hint">— or, bring your own IRIX: —</span>
    <label class="hint">disk <input type="file" id="disk" accept=".img,.iso,.raw,.qcow2,.chd,application/octet-stream"></label>
    <label class="hint">SGI PROM <input type="file" id="prom" accept=".bin,application/octet-stream"></label>
    <button id="bootIrix">Boot IRIX</button>
    <span id="status">status: <b id="statusText">idle</b><b id="rate"></b></span>
  </div>

  <div id="stage">
    <div id="screen"><canvas id="fb" width="1280" height="1024"></canvas></div>
    <pre id="term"></pre>
  </div>

<script src="build_id.js"></script>
<script>
  const term = document.getElementById('term');
  const statusText = document.getElementById('statusText');
  const buildEl = document.getElementById('build');
  buildEl.textContent = 'build ' + (self.INDYSIM_BUILD || 'unknown');
  const screen = document.getElementById('screen');
  const canvas = document.getElementById('fb');
  const ctx = canvas.getContext('2d');
  const bootLinux = document.getElementById('bootLinux');
  const bootIrix = document.getElementById('bootIrix');
  const diskInput = document.getElementById('disk');
  const promInput = document.getElementById('prom');
  const rate = document.getElementById('rate');
  let imgData = null;
  let lastStat = null;    // { icnt, t } for the mega-insns/sec readout

  function atBottom() { return term.scrollHeight - term.scrollTop - term.clientHeight < 40; }
  function append(text, cls) {
    const pin = atBottom();
    if (cls) { const s = document.createElement('span'); s.className = cls; s.textContent = text; term.appendChild(s); }
    else { term.appendChild(document.createTextNode(text)); }
    if (pin) term.scrollTop = term.scrollHeight;
  }

  const worker = new Worker('worker.js');
  worker.onmessage = (e) => {
    const m = e.data;
    if (m.kind === 'build') {
      const page = (self.INDYSIM_BUILD || '').split(' ')[0];
      if (page && !m.hash.startsWith(page)) {
        buildEl.textContent += ' (wasm ' + m.hash.slice(0, 7) + ': stale cache, hard-reload)';
      }
    }
    else if (m.kind === 'serial') { append(m.text); statusText.textContent = 'running'; }
    else if (m.kind === 'diag') { append(m.text, 'diag'); }
    else if (m.kind === 'frame') {
      if (!imgData || imgData.width !== m.w || imgData.height !== m.h) {
        canvas.width = m.w; canvas.height = m.h; imgData = ctx.createImageData(m.w, m.h);
      }
      imgData.data.set(new Uint8ClampedArray(m.buf));
      ctx.putImageData(imgData, 0, 0);
      screen.style.display = 'block';
    }
    else if (m.kind === 'stat') {
      const now = performance.now();
      if (lastStat) {
        const dt = (now - lastStat.t) / 1000;
        if (dt >= 0.5) {                         // refresh the readout ~2 Hz
          const mips = (m.icnt - lastStat.icnt) / dt / 1e6;
          rate.textContent = '  ·  ' + mips.toFixed(1) + ' Minsn/s';
          lastStat = { icnt: m.icnt, t: now };
        }
      } else {
        lastStat = { icnt: m.icnt, t: now };
      }
    }
  };
  worker.onerror = (e) => { statusText.textContent = 'worker error'; append('[page] ' + e.message + '\n', 'diag'); };

  function lockControls(what) {
    bootLinux.disabled = true; bootIrix.disabled = true;
    diskInput.disabled = true; promInput.disabled = true;
    statusText.textContent = what;
  }
  bootLinux.onclick = () => {
    lockControls('loading module…');
    append('[page] click the screen to type; click again (or Esc) releases mouse capture\n', 'hint');
    worker.postMessage({ cmd: 'boot', mode: 'linux' });
  };
  bootIrix.onclick = () => {
    const disk = diskInput.files[0];
    const prom = promInput.files[0];
    if (!disk) { append('[page] pick an IP22 disk image first\n', 'diag'); return; }
    if (!prom) { append('[page] pick a real SGI PROM image (.bin) first\n', 'diag'); return; }
    lockControls('loading module + mounting disk + PROM…');
    append('[page] click the screen to type; click again (or Esc) releases mouse capture\n', 'hint');
    worker.postMessage({ cmd: 'boot', mode: 'irix', disk, prom });
  };

  /* ---- input: browser events -> PS/2 keyboard/mouse (forwarded to the worker) ---- */
  const KEYMAP = (() => {
    const m = {
      Escape: 'esc', Backspace: 'backspace', Tab: 'tab', Enter: 'enter', Space: 'space',
      CapsLock: 'capslock', ShiftLeft: 'shift', ShiftRight: 'rshift',
      ControlLeft: 'ctrl', ControlRight: 'ctrl', AltLeft: 'alt', AltRight: 'alt',
      Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']', Backslash: '\\',
      Semicolon: ';', Quote: "'", Backquote: '`', Comma: ',', Period: '.', Slash: '/',
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      Home: 'home', End: 'end', PageUp: 'pgup', PageDown: 'pgdn', Insert: 'insert', Delete: 'delete',
    };
    for (let c = 65; c <= 90; c++) { m['Key' + String.fromCharCode(c)] = String.fromCharCode(c + 32); }  // KeyA -> "a"
    for (let d = 0; d <= 9; d++) { m['Digit' + d] = '' + d; }
    for (let f = 1; f <= 12; f++) { m['F' + f] = 'f' + f; }
    return m;
  })();

  // Click the canvas to "capture" input (keyboard + mouse); Esc or clicking away
  // releases.  Pointer lock is best-effort (it hides the cursor and gives clean
  // relative motion) but NOT required -- Safari over plain HTTP/LAN usually blocks
  // it, and the demo must still work, so input is gated on `captured`, not on lock.
  canvas.tabIndex = 0;
  let captured = false;
  function setCaptured(on) {
    captured = on;
    canvas.style.outline = on ? '2px solid #3a6ea5' : '';
  }
  canvas.addEventListener('click', () => {
    canvas.focus(); setCaptured(true);
    if (canvas.requestPointerLock) { try { canvas.requestPointerLock(); } catch (e) {} }
  });
  canvas.addEventListener('blur', () => setCaptured(false));

  function fwdKey(e, down) {
    if (!captured) { return; }
    if (e.code === 'Escape') { if (down) { setCaptured(false); if (document.exitPointerLock) { document.exitPointerLock(); } } return; }
    const name = KEYMAP[e.code];
    if (!name) { return; }     // unmapped key: leave it to the browser
    e.preventDefault();
    worker.postMessage({ cmd: 'key', down, name });
  }
  // listen on window (not just the focused canvas): Safari is flaky about focusing
  // a <canvas> on click, so relying on canvas focus dropped keystrokes.
  window.addEventListener('keydown', (e) => fwdKey(e, true));
  window.addEventListener('keyup',   (e) => fwdKey(e, false));

  canvas.addEventListener('mousemove', (e) => {
    if (!captured) { return; }
    worker.postMessage({ cmd: 'mouse', dx: e.movementX | 0, dy: e.movementY | 0, buttons: e.buttons & 7 });
  });
  const sendButtons = (e) => { if (!captured) { return; } e.preventDefault(); worker.postMessage({ cmd: 'mouse', dx: 0, dy: 0, buttons: e.buttons & 7 }); };
  canvas.addEventListener('mousedown', sendButtons);
  canvas.addEventListener('mouseup',   sendButtons);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
</body>
</html>
